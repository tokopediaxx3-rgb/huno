name: Dashboard preview
on:
  push:
    branches: ['codex/led-booth-dashboard']
    paths:
      - 'tools/capture-preview.mjs'
      - '.github/workflows/preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture dashboard preview
        run: node tools/capture-preview.mjs
      - name: Save preview images
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: docs/previews/
