name: Dashboard checks
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Electrical and backup tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
      - name: Save production build
        uses: actions/upload-artifact@v4
        with:
          name: huno-dashboard-dist
          path: dist/
      - name: Save browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
